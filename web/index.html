<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bagdar: a GPS for learning</title>
  <meta name="description" content="Bagdar locates what you know, plans the shortest route to your exam and picks each next step.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%2319171b'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/SourceSerif4-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top wrap">
    <a class="brand" href="#/" aria-label="Bagdar, choose a destination">bagdar</a>
    <span class="label top-where" id="top-where"></span>
    <button class="textlink label" id="theme" type="button" aria-label="Switch colour theme">theme</button>
  </header>

  <main id="view" class="wrap" tabindex="-1">
    <p class="label loading">starting the engine</p>
  </main>

  <nav class="panel dock" id="dock" aria-label="Sections" hidden>
    <span class="dock-indicator" id="dock-indicator" aria-hidden="true"></span>
    <a href="#/drive" data-view="drive">drive</a>
    <a href="#/map" data-view="map">map</a>
    <a href="#/engine" data-view="engine">engine</a>
  </nav>

  <div class="panel toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="wrap">Bagdar needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
