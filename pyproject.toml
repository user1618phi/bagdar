[project]
name = "bagdar"
version = "1.0.0"
description = "A GPS for learning: an HMM locates the learner, A* plans the route, an MDP picks each step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mustafa Kassym" }]
dependencies = []  # standard library only

[project.scripts]
bagdar = "bagdar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bagdar"]

[tool.ruff]
line-length = 130
target-version = "py310"
